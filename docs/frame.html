<!doctype html>
<html lang="de">
<meta charset="utf-8">
<style>
body{font:11px monospace;background:#fff;margin:16px}
.row{display:flex;align-items:center;gap:4px}
.box{border:1px solid #000;padding:4px 6px;text-align:center}
.small{font-size:10px;color:#333}
.arrow{margin-left:6px}
</style>

<div class="row">
  <div class="box" style="background-color: yellow">netId<br><span class="small">1B</span></div>
  <div class="box" style="background-color: yellow">len<br><span class="small">4Bit+4Bit</span></div>
  <div class="box" style="background-color: yellow">dataLen<br><span class="small">1B</span></div>
  <div class="box" style="background-color: lightgreen">IV<br><span class="small">12B</span></div>
  <div class="box" style="background-color: lightgreen">TAG<br><span class="small">16B</span></div>
  <div class="box" style="background-color: lightblue">cipher<br><span class="small">AES-GCM</span></div>
</div>

<div class="arrow" style="margin-left: 135px">rawData (verschlüsselt) <span style="margin-left: 7px">^</div>

<div class="row" style="margin-left: 133px">
  <div class="box" style="background-color: lightblue">seq<br><span class="small">4B</span></div>
  <div class="box" style="background-color: lightblue">dst<br><span class="small">nB</span></div>
  <div class="box" style="background-color: lightblue">src<br><span class="small">nB</span></div>
  <div class="box" style="background-color: lightblue">payload<br><span class="small">nB</span></div>
</div>

<div style="position: fixed; top: 65px">
    <span style="background-color: yellow">GCM-AAD</span>
    <span style="background-color: lightgreen">AES Metadata</span>
    <br>
    <span style="background-color: lightblue; position: fixed; top: 80px">Encrypted Data</span>
</div>
</html>
